name: Import MAX TOUR v28 package

on:
  push:
    branches:
      - demo/max-tour-demo
    paths:
      - .github/workflows/import-v28-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-package:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve temporary package download API
        env:
          SHARE_URL: https://firestorage.ai/ja/f/TquebyQrZbER
        run: |
          set -euo pipefail
          curl -LfsS "$SHARE_URL" -o /tmp/page.html
          JS_PATH=$(grep -o '/_next/static/chunks/app/(files)/ja/f/page-[^"<]*\.js' /tmp/page.html | head -n 1)
          test -n "$JS_PATH"
          echo "JS_PATH=$JS_PATH"
          curl -LfsS "https://firestorage.ai${JS_PATH}" -o /tmp/page.js
          echo '--- API/download candidates ---'
          grep -Eo '.{0,100}(api|download|share|publicId|public_id|fileId|file_id).{0,180}' /tmp/page.js | head -n 200 || true
