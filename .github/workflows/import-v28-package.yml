name: Import MAX TOUR v28 package

on:
  push:
    branches:
      - demo/max-tour-demo
    paths:
      - .github/workflows/import-v28-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-v28:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v5
        with:
          ref: demo/max-tour-demo
          fetch-depth: 0

      - name: Download verified standalone v28 package
        env:
          API_BASE: https://api.firestorage.ai/dev/file
          SHARE_ID: TquebyQrZbER
          EXPECTED_SHA256: fda7975b9b76bc5923577cabf92891a6ed83399c8c9913c838be6369cfd1fedd
        run: |
          set -euo pipefail
          list=$(curl -LfsS "$API_BASE/shares/$SHARE_ID/files?maxResults=1000")
          file_id=$(echo "$list" | jq -r '.files[] | select(.fileName == "standalone-v28-source.zip") | .fileId' | head -n1)
          test -n "$file_id"
          test "$file_id" != "null"
          response=$(curl -LfsS -X POST "$API_BASE/shares/$SHARE_ID/files/$file_id/download")
          download_url=$(echo "$response" | jq -r '.downloadUrl')
          test -n "$download_url"
          test "$download_url" != "null"
          curl -LfsS "$download_url" -o /tmp/standalone-v28-source.zip
          echo "$EXPECTED_SHA256  /tmp/standalone-v28-source.zip" | sha256sum -c -

      - name: Replace standalone-v28 from exact package
        run: |
          set -euo pipefail
          rm -rf standalone-v28 /tmp/v28-import
          mkdir -p /tmp/v28-import
          unzip -q /tmp/standalone-v28-source.zip -d /tmp/v28-import
          test -f /tmp/v28-import/standalone-v28/source/manifest.json
          mv /tmp/v28-import/standalone-v28 ./standalone-v28

      - name: Verify exact source and standalone build
        working-directory: standalone-v28
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm test
          npm run build
          grep -Fq 'MaxTour Mini App Prototype v28' dist/index.html
          grep -Fq 'runtime-api.js' dist/index.html
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/catalog.v28.json','utf8')).length)")" = "15"

      - name: Commit exact standalone v28 source
        run: |
          set -euo pipefail
          rm -f standalone-v28/.source-import-marker
          rm -f .github/workflows/import-v28-package.yml
          git config user.name 'VIIVERSION deploy bot'
          git config user.email '49186663+mirozdanie6v@users.noreply.github.com'
          git add -A standalone-v28 .github/workflows/import-v28-package.yml
          if git diff --cached --quiet; then
            echo 'Standalone v28 is already imported.'
            exit 0
          fi
          git commit -m 'feat(demo): import exact standalone MAX TOUR v28 source'
          git push origin HEAD:demo/max-tour-demo
