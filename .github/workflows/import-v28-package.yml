name: Import MAX TOUR v28 package

on:
  push:
    branches:
      - demo/max-tour-demo
    paths:
      - .github/workflows/import-v28-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-package:
    runs-on: ubuntu-latest
    steps:
      - name: List share client chunks
        env:
          SHARE_URL: https://firestorage.ai/ja/f/TquebyQrZbER
        run: |
          set -euo pipefail
          curl --max-time 10 -LfsS "$SHARE_URL" -o /tmp/page.html
          echo '--- chunks ---'
          grep -o '/_next/static/chunks/[^"<]*\.js' /tmp/page.html | sort -u
