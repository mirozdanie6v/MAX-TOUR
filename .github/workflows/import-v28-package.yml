name: Import MAX TOUR v28 package

on:
  push:
    branches:
      - demo/max-tour-demo
    paths:
      - .github/workflows/import-v28-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-package:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Firestorage API base
        run: |
          set -euo pipefail
          curl --max-time 15 -LfsS 'https://firestorage.ai/_next/static/chunks/4899-d89df949f2dbd5af.js' -o /tmp/app.js
          python - <<'PY'
          from pathlib import Path
          s = Path('/tmp/app.js').read_text()
          for needle in ['files?maxResults=1000', '/shares/', 'let f=', 'const f=']:
              print(f'=== {needle} ===')
              start = 0
              hits = 0
              while hits < 5:
                  i = s.find(needle, start)
                  if i < 0:
                      break
                  print(s[max(0, i-1200):i+2500])
                  print('\n---\n')
                  hits += 1
                  start = i + len(needle)
          PY
