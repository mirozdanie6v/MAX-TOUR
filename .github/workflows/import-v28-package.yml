name: Import MAX TOUR v28 package

on:
  push:
    branches:
      - demo/max-tour-demo
    paths:
      - .github/workflows/import-v28-package.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-package:
    runs-on: ubuntu-latest
    steps:
      - name: Trace share download API
        env:
          SHARE_URL: https://firestorage.ai/ja/f/TquebyQrZbER
        run: |
          set -euo pipefail
          curl -LfsS "$SHARE_URL" -o /tmp/page.html
          grep -o '/_next/static/chunks/[^"<]*\.js' /tmp/page.html | sort -u > /tmp/chunks.txt
          echo "chunks=$(wc -l < /tmp/chunks.txt)"
          : > /tmp/all.js
          while IFS= read -r path; do
            echo "fetch $path"
            curl -LfsS "https://firestorage.ai${path}" >> /tmp/all.js || true
            printf '\n' >> /tmp/all.js
          done < /tmp/chunks.txt
          echo '--- likely API strings ---'
          grep -Eo '[/A-Za-z0-9_?=&.:-]{0,140}(api|download|share|publicId|public_id|fileId|file_id)[/A-Za-z0-9_?=&.:-]{0,220}' /tmp/all.js | sort -u | head -n 300 || true
          echo '--- fetch calls ---'
          grep -Eo '.{0,120}fetch\(.{0,260}' /tmp/all.js | head -n 200 || true
