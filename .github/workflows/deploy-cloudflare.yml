name: Deploy MAX TOUR to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_DOMAIN: max-tour.viiversion.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 21; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 22; }

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Seed verified MAX TOUR baseline
        run: npx wrangler d1 execute DB --remote --config wrangler.jsonc --file=seed/verified-max-tour-data.sql --yes

      - name: Deploy Worker and assets
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          base="https://${TARGET_DOMAIN}"
          ok=0
          for attempt in $(seq 1 24); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 15 -o /tmp/health.json -w '%{http_code}' "$base/api/health" || true)
            if [ "$code" = "200" ] && jq -e '.ok == true and .database == "D1"' /tmp/health.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          curl -L -fsS "$base/" -o /tmp/home.html
          grep -q 'MAX TOUR' /tmp/home.html
          echo "Verified ${base}/ and ${base}/api/health"
