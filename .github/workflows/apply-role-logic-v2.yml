name: Apply role logic v2

on:
  push:
    branches: [main]
    paths:
      - '.apply-role-logic-v2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python tools/apply_role_logic_v2b.py
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit patched sources
        run: |
          git config user.name 'mirozdanie6v'
          git config user.email '49186663+mirozdanie6v@users.noreply.github.com'
          git add src migrations
          git commit -m 'feat: add editable manager admin and owner business logic' || exit 0
          git push
