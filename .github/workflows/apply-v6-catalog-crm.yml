name: Apply V6 catalog CRM wiring

on:
  push:
    branches: [main]
    paths: ['.apply-v6-catalog-crm']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply wiring
        run: python tools/apply_v6_catalog_crm_routes.py
      - name: Commit clean production wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/PremiumApp.tsx src/worker/index.ts src/worker/services/group-departures.ts
          git rm -f tools/apply_v6_catalog_crm_routes.py .github/workflows/apply-v6-catalog-crm.yml .apply-v6-catalog-crm || true
          git rm -f .github/workflows/debug-typecheck-v6.yml .debug-typecheck-v6 docs/TYPECHECK_DEBUG_V6.txt || true
          git commit -m 'feat: wire source catalog and admin CRM into application'
          git pull --rebase origin main
          git push origin HEAD:main
