name: MAX TOUR Demo Validate

on:
  workflow_dispatch:
  push:
    branches:
      - demo/max-tour-demo

permissions:
  contents: read

concurrency:
  group: max-tour-demo-validation
  cancel-in-progress: true

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build client and Worker
        run: npm run build

      - name: Validate Cloudflare bundle without credentials
        run: npx wrangler deploy --dry-run --config wrangler.demo.jsonc --outdir .wrangler-dry-run

      - name: Deployment routing note
        run: |
          echo 'Validation complete.'
          echo 'Deployment to max-tour-demo.viiversion.com is performed by the authorized VIIVERSION runner in mirozdanie6v/rusinfocenter (.github/workflows/deploy-max-tour-demo-shared.yml).'
