name: MAX TOUR Demo Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - demo/max-tour-demo

permissions:
  contents: read

concurrency:
  group: max-tour-demo
  cancel-in-progress: true

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout demo branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build client and Worker
        run: npm run build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply max-tour-demo --remote --config wrangler.demo.jsonc

      - name: Seed verified MAX TOUR demo data
        run: npx wrangler d1 execute max-tour-demo --remote --config wrangler.demo.jsonc --file=seed/verified-max-tour-data.sql

      - name: Deploy demo Worker and static assets
        run: npx wrangler deploy --config wrangler.demo.jsonc

      - name: Demo smoke test
        shell: bash
        run: |
          set -euo pipefail
          base='https://max-tour-demo.viiversion.com'
          jar=/tmp/max-tour-demo-cookies.txt

          curl -L -fsS --retry 8 --retry-delay 4 --connect-timeout 5 --max-time 45 "$base/" -o /tmp/home.html
          grep -q 'MAX TOUR' /tmp/home.html

          curl -L -fsS --retry 8 --retry-delay 4 --connect-timeout 5 --max-time 45 "$base/api/health" -o /tmp/health.json
          jq -e '.ok == true and .database == "D1"' /tmp/health.json >/dev/null

          curl -L -fsS -c "$jar" -b "$jar" "$base/api/session" -o /tmp/session.json
          jq -e '.ok == true and .demoSession == true' /tmp/session.json >/dev/null

          curl -L -fsS -c "$jar" -b "$jar" "$base/api/tours" -o /tmp/tours.json
          jq -e '.items | length >= 8' /tmp/tours.json >/dev/null

          curl -L -fsS -c "$jar" -b "$jar" "$base/api/tours/dalat-premium/availability" -o /tmp/availability.json
          date=$(jq -r '.items[0].date // empty' /tmp/availability.json)
          test -n "$date"

          jq -n --arg date "$date" '{tourId:"dalat-premium",format:"group",date:$date,adults:2,children:[{height:112}],hotel:"Amiana Resort",transferZoneId:"north",participants:[{fullName:"Demo Main Traveler",birthDate:"1990-01-01"},{fullName:"Demo Companion",birthDate:"1992-02-02"},{fullName:"Demo Child",birthDate:"2020-03-03"}],contact:{name:"Demo Traveler",phone:"00000"},paymentChoice:"deposit",paymentMethod:"card",source:"Telegram"}' > /tmp/quote-request.json
          curl -L -fsS -c "$jar" -b "$jar" -H 'Content-Type: application/json' --data-binary @/tmp/quote-request.json "$base/api/booking/quote" -o /tmp/quote.json
          jq -e '.quote.demo == true and .quote.totalMinor > 0 and .quote.payNowMinor > 0' /tmp/quote.json >/dev/null

          echo 'MAX TOUR demo smoke passed.'
