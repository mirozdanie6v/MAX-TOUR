name: MAX TOUR Pre-External Completion Patch

on:
  push:
    branches: [pre-external-completion]
    paths:
      - 'tools/wire_pre_external_completion.py'
      - '.github/workflows/preexternal-completion-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pre-external-completion
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Wire final package
        run: python tools/wire_pre_external_completion.py
      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker/index.ts src/client/lib/api.ts src/client/OwnerPage.tsx
          git commit -m 'feat: expose readiness and enforce trusted browser mutations'
          git push origin HEAD:pre-external-completion
