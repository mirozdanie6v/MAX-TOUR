name: Create AutoWorld alias

on:
  push:
    branches: [main]
    paths:
      - '.create-autoworld-alias'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require Cloudflare credentials
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
      - name: Deploy alias worker
        run: npx --yes wrangler@4 deploy --config tmp-autoworld-alias/wrangler.jsonc
      - name: Verify alias
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -L -fsS --connect-timeout 8 --max-time 20 https://autoworld.viiversion.com/api/health -o /tmp/health.json; then
              jq -e '.ok == true and .service == "auto-sale-yandex"' /tmp/health.json >/dev/null
              echo "Alias verified: https://autoworld.viiversion.com/"
              exit 0
            fi
            echo "Waiting for custom domain ($i/24)..."
            sleep 10
          done
          echo "Custom domain did not verify in time"
          exit 1
