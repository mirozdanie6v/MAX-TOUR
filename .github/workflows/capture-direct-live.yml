name: Capture direct live MAX TOUR screens

on:
  push:
    branches: [kp-render-v1]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Capture live interfaces directly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screens
          CHROME="$(which chrome || which google-chrome || which chromium || which chromium-browser)"
          echo "Chrome: $CHROME"
          capture() {
            local url="$1" out="$2" size="$3"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage \
              --window-size="$size" --force-device-scale-factor=1 --virtual-time-budget=20000 \
              --screenshot="$out" "$url"
          }
          capture 'https://max-tour.viiversion.com/' 'screens/site.png' '1440,1000'
          capture 'https://max-tour-demo.viiversion.com/' 'screens/miniapp.png' '430,932'
          capture 'https://max-tour-demo.viiversion.com/admin/' 'screens/admin.png' '1440,1000'
          capture 'https://max-tour-demo.viiversion.com/director/' 'screens/director.png' '1440,1000'
          file screens/*
          ls -lh screens

      - uses: actions/upload-artifact@v4
        with:
          name: max-tour-direct-live-screens
          path: screens/*.png
          retention-days: 3
