name: Bootstrap source probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source bundle download
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.firestorage.ai/dev/file'
          share='7BHHEoPT_mIF'
          curl -fsS "$base/shares/$share/files?maxResults=1000" -o /tmp/files.json
          jq '{fileCount:(.files|length), files:[.files[]|{fileId,fileName,sizeBytes,contentType}]}' /tmp/files.json
          file_id=$(jq -r '.files[] | select(.fileName=="max-tour-fullstack.tar.gz") | .fileId' /tmp/files.json | head -n1)
          test -n "$file_id"
          curl -fsS -X POST "$base/shares/$share/files/$file_id/download" -o /tmp/download.json
          download_url=$(jq -r '.downloadUrl' /tmp/download.json)
          test "$download_url" != "null"
          curl -L -fsS "$download_url" -o /tmp/source.tar.gz
          test "$(sha256sum /tmp/source.tar.gz | awk '{print $1}')" = '02a03c97d0ebf23ab956502b9b27fb42d1622fa881666e97bc9a33bdcba3e5c5'
          tar -tzf /tmp/source.tar.gz | head -n 60
