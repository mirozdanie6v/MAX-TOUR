name: Debug typecheck v6

on:
  push:
    branches: [main]
    paths: ['.debug-typecheck-v6']

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > docs/TYPECHECK_DEBUG_V6.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> docs/TYPECHECK_DEBUG_V6.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TYPECHECK_DEBUG_V6.txt
          git commit -m 'debug: capture commerce v6 typecheck diagnostics' || true
          git push origin HEAD:main
