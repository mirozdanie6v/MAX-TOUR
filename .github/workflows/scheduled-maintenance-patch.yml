name: MAX TOUR Scheduled Maintenance Patch

on:
  push:
    branches: [pre-external-completion]
    paths:
      - 'tools/wire_scheduled_maintenance.py'
      - '.github/workflows/scheduled-maintenance-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: pre-external-completion
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Wire scheduled maintenance
        run: python tools/wire_scheduled_maintenance.py
      - name: Commit generated source change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker/index.ts
          git commit -m 'ops: run expired demo cleanup on Cloudflare cron'
          git push origin HEAD:pre-external-completion
