name: Capture real MAX TOUR screens

on:
  push:
    branches: [kp-render-v1]
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download live rendered screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screens
          curl -L --fail --retry 3 -o screens/site.png 'https://image.thum.io/get/width/1200/crop/1000/wait/10/noanimate/https://max-tour.viiversion.com/'
          curl -L --fail --retry 3 -o screens/miniapp.png 'https://image.thum.io/get/width/700/crop/1200/wait/10/noanimate/https://max-tour-demo.viiversion.com/'
          curl -L --fail --retry 3 -o screens/admin.png 'https://image.thum.io/get/width/1200/crop/1000/wait/10/noanimate/https://max-tour-demo.viiversion.com/admin/'
          curl -L --fail --retry 3 -o screens/director.png 'https://image.thum.io/get/width/1200/crop/1000/wait/10/noanimate/https://max-tour-demo.viiversion.com/director/'
          file screens/*
          ls -lh screens

      - uses: actions/upload-artifact@v4
        with:
          name: max-tour-real-live-screens
          path: screens/*.png
          retention-days: 3
