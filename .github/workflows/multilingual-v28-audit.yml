name: Multilingual v28 i18n audit

on:
  push:
    branches:
      - production/max-tour-multilingual
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test and build exact standalone v28
        working-directory: standalone-v28
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm test
          npm run build
      - name: Extract customer-facing Russian strings
        working-directory: standalone-v28
        run: node scripts/extract-i18n.mjs > i18n-audit.json
      - name: Browser smoke Vietnamese customer UI
        working-directory: standalone-v28
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
          python3 -m http.server 4173 --directory dist >/tmp/max-tour-i18n-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/smoke-i18n-ui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: max-tour-v28-i18n-audit
          path: |
            standalone-v28/i18n-audit.json
            standalone-v28/dist/catalog.v28.json
            standalone-v28/dist/index.html
