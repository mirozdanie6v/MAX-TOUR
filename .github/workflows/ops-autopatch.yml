name: MAX TOUR Ops Exact Patch

on:
  push:
    branches: [ops-hardening]
    paths:
      - 'tools/apply_ops_hardening_patch.py'
      - '.github/workflows/ops-autopatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ops-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact patch
        run: python tools/apply_ops_hardening_patch.py
      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker/index.ts src/client/PremiumApp.tsx
          git commit -m 'feat: wire staff directory and API hardening into app'
          git push origin HEAD:ops-hardening
