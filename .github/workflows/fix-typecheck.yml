name: Fix MAX TOUR typecheck

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fix async React effect and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/client/App.tsx')
          s=p.read_text()
          old='useEffect(load,[id]);const setStatus=async'
          new='useEffect(()=>{void load()},[id]);const setStatus=async'
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/App.tsx
          git commit -m 'fix: make manager order effect React-safe'
          git push origin HEAD:main
