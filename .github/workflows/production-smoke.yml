name: MAX TOUR Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public production URL and role mutations
        shell: bash
        run: |
          set -euo pipefail
          base='https://max-tour.viiversion.com'
          jar=/tmp/max-tour-cookies.txt

          curl -L -fsS --connect-timeout 5 --max-time 20 "$base/" -o /tmp/home.html
          grep -q 'MAX TOUR' /tmp/home.html
          curl -L -fsS --connect-timeout 5 --max-time 20 "$base/api/health" -o /tmp/health.json
          jq -e '.ok == true and .service == "max-tour-demo" and .database == "D1"' /tmp/health.json >/dev/null

          curl -fsS -c "$jar" -b "$jar" "$base/api/session" -o /tmp/session.json
          jq -e '.ok == true and .demoSession == true' /tmp/session.json >/dev/null

          echo '--- Owner overview/settings ---'
          curl -fsS -c "$jar" -b "$jar" "$base/api/owner/overview" -o /tmp/owner.json
          jq -e '.demo == true and .metrics.orders >= 5 and (.workflow | length) == 4' /tmp/owner.json >/dev/null
          curl -fsS -c "$jar" -b "$jar" -X PATCH -H 'content-type: application/json' \
            --data '{"managerSlaMinutes":20,"managerNotifications":true,"ownerDigest":"Ежедневно","salesFocus":"Премиум экскурсии · QA"}' \
            "$base/api/owner/settings" -o /tmp/owner-patch.json
          jq -e '.settings.managerSlaMinutes == 20 and .settings.salesFocus == "Премиум экскурсии · QA"' /tmp/owner-patch.json >/dev/null

          echo '--- Manager operations editor ---'
          curl -fsS -c "$jar" -b "$jar" "$base/api/manager/orders" -o /tmp/orders.json
          order_id=$(jq -r '.items[0].id' /tmp/orders.json)
          test -n "$order_id" -a "$order_id" != 'null'
          curl -fsS -c "$jar" -b "$jar" -X PATCH -H 'content-type: application/json' \
            --data '{"assignedManager":"QA Manager","pickupNote":"QA pickup","internalNote":"QA internal note","markContacted":true}' \
            "$base/api/manager/orders/$order_id/ops" -o /tmp/ops.json
          jq -e '.ops.assignedManager == "QA Manager" and .ops.pickupNote == "QA pickup" and .ops.internalNote == "QA internal note" and .ops.lastContactAt != null' /tmp/ops.json >/dev/null

          echo '--- Admin editor and create tour ---'
          curl -fsS -c "$jar" -b "$jar" -X PATCH -H 'content-type: application/json' \
            --data '{"adultMinor":5300,"published":true}' \
            "$base/api/admin/tours/dalat-premium" -o /tmp/admin-edit.json
          jq -e '.item.pricingRules.adultMinor == 5300 and .item.published == true' /tmp/admin-edit.json >/dev/null
          curl -fsS -c "$jar" -b "$jar" "$base/api/tours/dalat-premium" -o /tmp/tour-after.json
          jq -e '.item.pricingRules.adultMinor == 5300' /tmp/tour-after.json >/dev/null
          curl -fsS -c "$jar" -b "$jar" -X POST -H 'content-type: application/json' \
            --data '{"title":"QA DEMO tour","direction":"Нячанг","description":"QA only","priceMode":"dynamic-request","adultMinor":0,"scheduleMode":"request","images":[],"published":true}' \
            "$base/api/admin/tours" -o /tmp/admin-add.json
          jq -e '.item.id | startswith("demo-tour-")' /tmp/admin-add.json >/dev/null

          echo '--- Reset isolated QA demo session ---'
          curl -fsS -c "$jar" -b "$jar" -X POST -H 'content-type: application/json' --data '{}' "$base/api/demo/reset" -o /tmp/reset.json
          jq -e '.ok == true and .reset == true' /tmp/reset.json >/dev/null
          curl -fsS -c "$jar" -b "$jar" "$base/api/tours/dalat-premium" -o /tmp/tour-reset.json
          jq -e '.item.pricingRules.adultMinor == 5200' /tmp/tour-reset.json >/dev/null

          echo 'Production home, D1, Owner, Manager and Admin mutations verified and QA session reset.'
