name: Post enrichment fix v3

on:
  push:
    branches: [main]
    paths:
      - '.post-enrichment-fix-v3'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Fix itinerary galleries
        run: python tools/post_enrichment_fix_v3.py
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit corrections
        run: |
          git config user.name 'mirozdanie6v'
          git config user.email '49186663+mirozdanie6v@users.noreply.github.com'
          git add seed
          git commit -m 'fix: align excursion galleries with actual itineraries' || exit 0
          git push
