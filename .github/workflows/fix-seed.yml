name: Fix D1 seed transaction wrapper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove unsupported SQL transaction wrapper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('seed/verified-max-tour-data.sql')
          lines=p.read_text().splitlines()
          kept=[line for line in lines if line.strip().upper() not in {'BEGIN TRANSACTION;','COMMIT;','BEGIN;','END TRANSACTION;'}]
          if len(kept)==len(lines):
              raise SystemExit('No transaction wrapper found')
          p.write_text('\n'.join(kept)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seed/verified-max-tour-data.sql
          git commit -m 'fix: make verified seed compatible with remote D1'
          git push origin HEAD:main
