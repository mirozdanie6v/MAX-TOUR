name: MAX TOUR CI

on:
  push:
    branches: [main, integration-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build client and Worker
        run: npm run build

      - name: Apply D1 migrations locally
        run: npm run db:migrate:local

      - name: Seed verified MAX TOUR data locally
        run: npm run db:seed:local

      - name: Re-run verified seed for idempotency
        run: npm run db:seed:local

      - name: Verify D1 integration schema and verified baseline
        shell: bash
        run: |
          set -euo pipefail
          out=$(npx wrangler d1 execute max-tour-demo --local --json --command "
            SELECT COUNT(*) AS destinations FROM destinations WHERE data_status='verifiedSite';
            SELECT COUNT(*) AS tours FROM tours WHERE data_status='verifiedSite';
            SELECT json_extract(pricing_rules_json,'$.adultMinor') AS adultMinor,
                   json_extract(pricing_rules_json,'$.childRules[1].priceMinor') AS childMinor
              FROM tours WHERE id='dalat-premium';
            SELECT COUNT(*) AS outboxTable FROM sqlite_master WHERE type='table' AND name='notification_outbox';
            SELECT COUNT(*) AS customerVisibleColumn FROM pragma_table_info('orders') WHERE name='customer_visible';
            SELECT COUNT(*) AS promoDiscountColumns FROM pragma_table_info('demo_promotions') WHERE name IN ('discount_type','discount_value');
          ")
          printf '%s\n' "$out" > /tmp/d1-check.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/d1-check.json','utf8'));
          const rows=data.flatMap(x=>x.results||[]);
          const find=(k)=>rows.find(r=>Object.prototype.hasOwnProperty.call(r,k));
          const destinations=Number(find('destinations')?.destinations ?? 0);
          const tours=Number(find('tours')?.tours ?? 0);
          const price=find('adultMinor')||{};
          const outbox=Number(find('outboxTable')?.outboxTable ?? 0);
          const customerVisible=Number(find('customerVisibleColumn')?.customerVisibleColumn ?? 0);
          const promoColumns=Number(find('promoDiscountColumns')?.promoDiscountColumns ?? 0);
          if (destinations < 5 || tours < 8 || Number(price.adultMinor)!==5200 || Number(price.childMinor)!==3800 || outbox!==1 || customerVisible!==1 || promoColumns!==2) {
            console.error({destinations,tours,price,outbox,customerVisible,promoColumns});
            process.exit(1);
          }
          console.log('D1 verified baseline and integration schema OK');
          NODE

      - name: Validate Wrangler production bundle
        run: npx wrangler deploy --dry-run --outdir dist/wrangler-dry-run

      - name: Persist npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: update npm lockfile'
            git push origin HEAD:main
          else
            echo 'package-lock.json unchanged'
          fi

      - name: Cloudflare credential status
        shell: bash
        run: |
          if [ -n "${CF_TOKEN:-}" ]; then echo 'CLOUDFLARE_API_TOKEN=configured'; else echo 'CLOUDFLARE_API_TOKEN=missing'; fi
          if [ -n "${CF_ACCOUNT:-}" ]; then echo 'CLOUDFLARE_ACCOUNT_ID=configured'; else echo 'CLOUDFLARE_ACCOUNT_ID=missing'; fi
