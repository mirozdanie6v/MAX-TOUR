name: MAX TOUR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Persist npm lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json unchanged'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: add npm lockfile'
            git push origin HEAD:main
          fi

      - name: Cloudflare credential status
        shell: bash
        run: |
          if [ -n "${CF_TOKEN:-}" ]; then echo 'CLOUDFLARE_API_TOKEN=configured'; else echo 'CLOUDFLARE_API_TOKEN=missing'; fi
          if [ -n "${CF_ACCOUNT:-}" ]; then echo 'CLOUDFLARE_ACCOUNT_ID=configured'; else echo 'CLOUDFLARE_ACCOUNT_ID=missing'; fi
